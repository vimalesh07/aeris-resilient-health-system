[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "TELEGRAM_BOT_USERNAME,NEXT_PUBLIC_TELEGRAM_BOT_USERNAME,ARDUINO_PORT,ARDUINO_BAUD,WEBSOCKET_PORT,NEXT_PUBLIC_WEBSOCKET_PORT,GEMINI_MODEL"

[[plugins]]
  package = "@netlify/plugin-nextjs"
