<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AERIS — Offline</title>
    <style>
      :root { --bg: #F4F3F0; --surface: #FFFFFF; --line: #E4E2DD; --fg: #0F1419; --fg-2: #4A5260; --brand: #DC2626; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #07090D; --surface: #11151C; --line: #232A35; --fg: #F2F4F7; --fg-2: #A3ABB8; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      main { width: 100%; max-width: 380px; padding: 28px 24px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); text-align: center; }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { margin: 16px 0 6px; font-size: 20px; }
      p { margin: 0 0 20px; color: var(--fg-2); font-size: 14px; line-height: 1.5; }
      button { height: 44px; padding: 0 20px; border: 0; border-radius: 10px; background: var(--brand); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>AERIS can't reach the network right now. Check your connection and try again. In an emergency, your AERIS device's LoRa SOS still works without the internet.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
